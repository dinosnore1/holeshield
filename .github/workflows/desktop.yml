name: Desktop builds

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "assets/dashboard.html"
      - "src/com/dino/holeshield/DnsPacket.java"
      - "src/com/dino/holeshield/Gravity.java"
      - "src/com/dino/holeshield/HostsParser.java"
      - "src/com/dino/holeshield/Blocklists.java"
      - "src/com/dino/holeshield/WebAuth.java"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "assets/dashboard.html"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-22.04, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm dnsutils

      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH

      - name: Test
        if: runner.os != 'Windows'
        run: ./desktop/tools/test.sh

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/tools/test.ps1

      - name: Package
        if: runner.os != 'Windows'
        env:
          MAC_APP_ONLY: "1"
        run: ./desktop/tools/package.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/tools/package.ps1

      - name: Smoke test macOS app image
        if: runner.os == 'macOS'
        run: ./desktop/tools/smoke.sh "desktop/build/dist/Hole Shield.app/Contents/MacOS/Hole Shield"

      - name: Smoke test Linux DEB
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /usr/share/applications /usr/share/desktop-directories \
            /etc/xdg/menus /root/.local/share/applications
          sudo env \
            XDG_DATA_HOME=/root/.local/share \
            XDG_DATA_DIRS=/usr/local/share:/usr/share \
            DEBIAN_FRONTEND=noninteractive \
            apt-get install -y ./desktop/build/dist/*.deb
          EXE="$(find /opt -type f \( -name 'Hole Shield' -o -name 'holeshield' \) | head -1)"
          test -n "$EXE"
          ./desktop/tools/smoke.sh "$EXE"

      - name: Smoke test Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktop/build/dist/*.msi | Select-Object -First 1
          $log = Join-Path $env:TEMP "holeshield-msi.log"
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", "`"$($msi.FullName)`"", "/qn", "/norestart", "/l*v", "`"$log`""
          )
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "MSI install failed with $($p.ExitCode)"
          }
          $exe = Get-ChildItem "C:\Program Files" -Recurse -Filter "Hole Shield.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installed executable not found" }
          ./desktop/tools/smoke.ps1 -Exe $exe.FullName

      - name: Upload macOS app input
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: holeshield-mac-input-${{ matrix.os }}
          path: desktop/build/dist/Hole Shield.app
          if-no-files-found: error

      - name: Upload Linux and Windows installers
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: holeshield-desktop-${{ matrix.os }}
          path: |
            desktop/build/dist/*.deb
            desktop/build/dist/*.rpm
            desktop/build/dist/*.msi
            desktop/build/dist/*.exe
          if-no-files-found: warn

  universal:
    name: macOS universal package
    needs: build
    if: needs.build.result == 'success'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: holeshield-mac-input-macos-15
          path: artifacts/arm

      - uses: actions/download-artifact@v4
        with:
          name: holeshield-mac-input-macos-15-intel
          path: artifacts/intel

      - name: Build and install universal package
        run: |
          set -euo pipefail
          ARM_APP=/tmp/hs-arm-app.app
          INTEL_APP=/tmp/hs-intel-app.app
          mkdir -p "$ARM_APP" "$INTEL_APP"
          cp -R artifacts/arm/Contents "$ARM_APP/Contents"
          cp -R artifacts/intel/Contents "$INTEL_APP/Contents"
          chmod +x "$ARM_APP/Contents/MacOS/Hole Shield" "$INTEL_APP/Contents/MacOS/Hole Shield"
          ./desktop/tools/package-universal-macos.sh \
            --arm "$ARM_APP" \
            --intel "$INTEL_APP" \
            --out desktop/build/dist \
            --version 2.3.4
          sudo installer -pkg desktop/build/dist/Hole-Shield-2.3.4-universal.pkg -target /
          ./desktop/tools/smoke.sh "/Applications/Hole Shield.app/Contents/MacOS/Hole Shield"

      - uses: actions/upload-artifact@v4
        with:
          name: holeshield-desktop-macos-universal
          path: desktop/build/dist/*universal*
          if-no-files-found: error
